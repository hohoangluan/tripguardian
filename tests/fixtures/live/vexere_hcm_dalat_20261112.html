s", "content": "LƯU Ý NHÀ XE\n\n1. Thời gian đến là dự kiến phụ thuộc vào tình hình thời tiết và mật độ giao thông trên đường (ban ngày xe có thể đến trễ từ 1-2 tiếng, ban đêm xe có thể đến sớm 1-2 tiếng so với giờ dự kiến)\n2. Tất cả các xe Trọng Minh đều xuất bến từ BX Miền Tây, các chuyến thể hiện điểm đón là 303 Trần Phú, Quận 5 là xe trung chuyển đưa từ Trần Phú ra bx Miền Tây lên xe, QK vui lòng có mặt trước 30p so với giờ xuất bến để đi trung chuyển.\n3. Đối với những chuyến xe không hiện điểm đón là Trần Phú, QK vui lòng di chuyển ra BX Miền Tây để xuất bến.\n4. Đối với xe phòng: Không áp dụng chính sách trẻ em, tối đa 2 người/phòng bất kể độ tuổi hoặc kích thước\n5. Đối với phòng đôi nằm 1 khách có thể kèm theo em bé dưới 120cm. Trên 120cm tính giá phòng đôi 2 người ((không áp dụng với vé có chương trình khuyến mãi)\n6. Hành lý ký gửi: Mỗi hành khách được phép ký gửi 1 kiện hành lý với trọng lượng tối đa là 20kg xếp chung 1 kiện không tách rời. Nếu hành lý vượt quá trọng lượng quy định, hành khách sẽ phải trả thêm phí hành lý quá cước. Kích thước hành lý ký gửi không được vượt quá 60cm x 40cm x 20cm\n7. NHÀ XE KHÔNG NHẬN THÚ CƯNG DƯỚI MỌI HÌNH THỨC, NẾU QÚY KHÁCH CỐ TÌNH MANG THEO NHÀ XE PHÁT HIỆN CÓ QUYỀN TỪ CHỐI VẬN CHUYỂN THÚ CƯNG HOẶC TỪ CHỐI VẬN CHUYỂN HÀNH KHÁCH MÀ KHÔNG HOÀN LẠI TIỀN VÉ.\n \nLưu ý về Khiếu nại: Để được hỗ trợ tốt nhất, quý khách vui lòng gửi phản hồi hoặc khiếu nại (nếu có) trong vòng 24 giờ kể từ khi kết thúc chuyến đi. Sau thời gian này, nhà xe xin phép từ chối tiếp nhận giải quyết để đảm bảo tính khách quan. Rất mong quý khách thông cảm.\n\nTrọng Minh xin chân thành cảm ơn.", "english_content": "BUS COMPANY NOTE\n1. Arrival times are approximate and depend on weather conditions and traffic conditions (during the day, the bus may arrive 1-2 hours late, and at night it may arrive 1-2 hours early compared to the scheduled time).\n\n2. All Trong Minh buses depart from the Western Bus Station. Buses showing 303 Tran Phu, District 5 as the pick-up point are shuttle buses that take passengers from Tran Phu to the Western Bus Station. Please arrive 30 minutes before departure time to board the shuttle bus.\n\n3. For buses that do not show Tran Phu as the pick-up point, please travel to the Western Bus Station to depart.\n\n4. For private rooms: No child policy applies, maximum 2 people per room regardless of age or size.\n5. For double rooms, 1 guest can be accompanied by a baby under 120cm. Over 120cm tall, double room rate applies (not applicable with promotional tickets).\n6. Checked baggage: Each passenger is allowed to check in 1 piece of baggage with a maximum weight of 20kg, packed together in one piece and not separated. If baggage exceeds the weight limit, passengers will have to pay extra excess baggage fees. Checked baggage dimensions must not exceed 60cm x 40cm x 20cm.\n7. THE BUS COMPANY DOES NOT ACCEPT PETS IN ANY FORM. IF PASSENGERS INTENTIONALLY BRING PETS, THE BUS COMPANY HAS THE RIGHT TO REFUSE TRANSPORTATION OF PETS OR PASSENGERS WITHOUT REFUNDING THE TICKET.\nNote Regarding Complaints: For the best support, please submit your feedback or complaint (if any) within 24 hours of the end of your trip. After this time, the transportation company reserves the right to refuse to process any complaints to ensure objectivity. We appreciate your understanding.\n\nThank you sincerely."}, "departure_date": "2026-11-12T00:00:00+07:00", "seatTemplateId": 10055, "companyId": 30353, "pickup_date": "2026-11-12T16:30:00.000Z", "route": {"name": "Sài Gòn - Đà Lạt (QL1A)", "fullTrip": true, "departure_date": "12-11-2026", "departure_time": "23:30", "utilities": [11, 14, 17, 18, 21, 23, 24, 25, 29, 36, 52, 57, 60], "schedules": [{"trip_code": "v2CJW4CRCUuAkaAjIzIgIzMDC7k94FOgoxMi0xMS0yMDI2SB1QyQNYAGgBqAGR7QGgAwE", "hour": "23", "minute": "30", "pickup_date": "2026-11-12T23:30+07:00", "arrival_time": "2026-11-13T07:30+07:00", "fare": {"original": 500000, "discount": 450000, "max": 700000}, "deposit_sel
