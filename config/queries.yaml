# {city} = city name from config/cities.yaml. Caps keep the crawl bounded and polite.
tiktok:
  pause_s: [0.5, 1]  # random wait between items; a person solves captchas in --headed runs
  tabs: 8  # max parallel video tabs; the working level is found automatically (data/tiktok/throttle.json)
  tabs_start: 2  # first run only
  cooldown_s: 60  # pause after a block before halving back in
  max_videos_per_query: 30
  max_comments_per_video: null  # null = every top-level comment
  queries:  # groups from docs/specs/CORPUS_SPEC.md §1
    general: ["{city} có gì chơi", "review du lịch {city}"]
    category: ["quán cà phê {city}", "quán ăn ngon {city}", "chợ đêm {city}"]
    experience: ["săn mây {city}", "view rừng thông {city}", "vườn hoa {city}"]
    audience: ["{city} đi cùng gia đình", "{city} cho người lớn tuổi", "{city} cặp đôi"]
    constraint: ["{city} ngày mưa", "{city} ít đi bộ"]
    trend: ["{city} mới mở"]
gmaps:
  pause_s: [0.5, 1]
  max_places_per_query: 60
  max_reviews_per_place: 50
  categories: [điểm tham quan, quán cà phê, nhà hàng, công viên, vườn hoa, bảo tàng, chợ, nhà thờ, chùa, thác, hồ, nông trại, quán bar, tiệm bánh]
