# Hidden Trip States for the offline Place Decision check (src/corpus/serving/evaluate.py, docs/P3_PLACE_DECISION.md §17).
# Each trip: hard filters "feature != value" (fail-closed), soft weights by feature id (value present / good / …),
# the role the shortlist fills, its size. `filters` and `prefs` lists below are crossed to make more trips.
shortlist: 8
trips:
  - {id: elderly_views, role: experience, hard: {steep_or_stairs: present, long_walk: present}, soft: {scenic_view: 1.0, photo_spot: 0.5}}
  - {id: kids_animals, role: experience, hard: {kids: unsuitable}, soft: {animals: 1.0, pick_your_own: 0.8, adventure_activity: 0.4}}
  - {id: wheelchair_cafe, role: experience, hard: {wheelchair: unsuitable, steep_or_stairs: present}, soft: {cozy_decor: 1.0, long_stay_chill: 0.6}}
  - {id: couple_sunset, role: experience, hard: {}, soft: {sunset_view: 1.0, couples: 0.8, scenic_view: 0.5}}
  - {id: group_food, role: meal, hard: {groups: unsuitable}, soft: {local_specialty_food: 1.0, food_quality: 0.8, value_for_money: 0.6}}
  - {id: rainy_day, role: experience, hard: {weather_exposed: present}, soft: {cozy_decor: 0.8, heritage_architecture: 0.6}}
  - {id: no_trap_budget, role: experience, hard: {tourist_trap: present}, soft: {value_for_money: 1.0, nature: 0.5}}
  - {id: hikers, role: experience, hard: {}, soft: {hiking: 1.0, nature: 0.8, cloud_hunting: 0.6}}
  - {id: worker, role: experience, hard: {noise: loud}, soft: {laptop_friendly: 1.0, long_stay_chill: 0.8}}
  - {id: rough_road_scooter, role: experience, hard: {rough_road_access: present}, soft: {flower_garden: 1.0, photo_spot: 0.6}}
cross:
  filters:
    - {}
    - {steep_or_stairs: present}
    - {long_walk: present}
    - {kids: unsuitable}
    - {elderly: unsuitable, steep_or_stairs: present}
  prefs:
    - {scenic_view: 1.0}
    - {cozy_decor: 1.0, drink_quality: 0.5}
    - {local_specialty_food: 1.0}
    - {nature: 1.0, flower_garden: 0.5}

# Test conversations for Trip Understanding (tests/trip/test_eval_conversations.py), from the new-user test of
# 09/10/2026 (docs/plans/OPEN_TASKS.md Each turn is a typed message. `expect` must hold after the last turn even
# with the agent down (the keyword rules alone); `expect_live` must also hold with the real Agent (pytest -m live).
# Fields: Trip State values; budget_ppd = the compiled VND per person per day.
conversations:
  - id: couple_budget_correction
    turns:
      - "Cuối tháng 10 mình đi Đà Lạt 3 ngày 2 đêm với bạn gái, thuê xe máy. Thích cà phê view đẹp, săn mây, không thích chỗ đông. Ngân sách khoảng 5 triệu cho 2 người."
      - "5 triệu là tổng cả chuyến cho 2 người nha… Mình cũng rất thích cà phê."
    expect: {month: 10, month_part: late, days: 3, companions: [partner], mobility: motorbike, budget_vnd: 5000000,
             budget_scope: trip_total, budget_ppd: 833333, liked_groups: [chill], soft: [cloud_hunting=present:love]}
    expect_live: {crowd_tolerance: avoid}
  - id: budget_said_late_without_scope
    turns:
      - "Đi Đà Lạt 2 ngày với người yêu, đi ô tô, tháng 12"
      - "ngân sách tầm 3 triệu"
    expect: {days: 2, companions: [partner], mobility: car, month: 12, budget_vnd: 3000000, budget_ppd: 750000}
