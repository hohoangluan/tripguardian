# Place Decision thresholds (docs/PLACE_DECISION.md). Starting values; tune after the pilot.
version: 1
center: {name: "trung tâm Đà Lạt", lat: 11.9404, lng: 108.4583}
speed_kmh: {motorbike: 25, car: 25, walk: 22}    # walk = no vehicle of their own (we never book a ride); starting estimate
road_factor: 1.4            # straight line -> road distance
radius_km: {motorbike: 12, car: 15, walk: 10}
area_bonus: 0.2             # same area as an anchor
crowd_busy_pct: 70          # Google popular times at or above this = busy
crowd_penalty: 0.2
rainy_months: [5, 6, 7, 8, 9, 10]
min_context_fit: 0.1        # below: stays in the pool, never in the shortlist
max_travel_min: 90          # travel time from the first center (lodging / base, else city center) above which a place is hidden; kept places and unknown positions stay
weights: {ctx: 1.0, pref: 2.0, nov: 1.0, exp: 0.3, pop: 0.2, unc: 0.5, price: 0.5, wish: 1.5}  # wish: Trip's wishes (decision.wishes)
wish:                       # decision.wishes: how much meeting one wish lifts a place (docs/PLACE_DECISION.md §8)
  a: {dish: 0.8, kind: 0.8, vibe: 0.8, like: 0.8, group: 0.4, purpose: 0.25}
  like_min: 0.3             # corpus.serving.similarity at or above this = "giống X"
  purpose:                  # Trip context.purpose -> what it leans to; bond, adventure lean to nothing
    relax: {group: chill}
    food_culture: {group: meal}
    nature: {group: nature}
    explore: {group: sights}
    photo: {feature: photo_spot, value: present}
price_ref_vnd: 300000       # price per person that counts as "expensive" (1.0) for price sensitivity
near_min: 12                # minutes: "Gần <tâm>" on a card
per_day: {slow: 3, normal: 4, packed: 6}
shortlist_days: 7
coach_min_people: 9         # a party this big counts as the companion large_group (same number as config/trip.yaml)
details_fit:                # context fit from serving details (docs/PLACE_DECISION.md): a verified fit verdict for a companion of the trip, and
  good_bonus: 0.1           # the features that companion needs (kids_play_area, stroller_access, rest_benches, toilet_available)
  bad_penalty: 0.2
  feature_bonus: 0.05
per_day_max: {slow: 4, normal: 5, packed: 7}
meals_per_day: 2
spare_factor: 1.6
pool_factor: 5
default_days: 2
day_start: "08:00"
day_end: "21:00"
leave_at: "15:00"
buffer_min: {slow: 30, normal: 20, packed: 10}
intra_leg_min: 10
far_km: 8
buckets: {early_morning: ["05:00", "07:00"], morning: ["07:00", "11:00"], noon: ["11:00", "13:00"],
          afternoon: ["13:00", "17:00"], evening: ["17:00", "19:00"], night: ["19:00", "22:00"]}
narrow_buckets: [early_morning, evening, night]
timed_features: [cloud_hunting, sunset_view, live_music]
timed_share: 0.6
night_open: "16:00"
infeasible_ratio: 1.35
budget_slack: 1.0
far_step: 0.8
travel_mult_min: 0.4
price_step: 0.5
pattern_min: 3
gap_min: 90
rethink_drops: 6
history_max: 50
unverified_show: 12
page_size: 24               # places per page of a tab; the user picks the page
replace_below: 0.3          # fewer of a page's places kept than this share after a rebuild -> "replaced whole"
first_token_s: 8
total_s: 30
display_groups:            # kinds of place Trip's liked_groups and purpose lean to (decision.wishes); meal = role meal
  nature: [nature, garden_farm, camping]
  sights: [attraction, museum, religious, amusement, market, tour, golf, other]
  chill: [cafe, spa, bar, dessert]
tabs:                       # Lựa chọn's tabs, in screen order: tab -> corpus category groups; any other group -> sights
  meal: [restaurant]
  snack: [dessert]
  cafe: [cafe]
  nature: [nature]
  garden: [garden_farm]
  camping: [camping]
  sights: [attraction, tour, golf, other]
  culture: [museum, religious]
  fun: [amusement]
  night: [bar]
  spa: [spa]
  market: [market, shop]
polarity:                   # good first, bad last
  crowd: [low, medium, high]
  noise: [quiet, moderate, loud]
  cleanliness: [clean, dirty]
  toilet: [clean, dirty]
  parking: [easy, hard]
  food_quality: [good, mixed, poor]
  drink_quality: [good, mixed, poor]
  service_attitude: [good, poor]
  service_quality: [good, mixed, poor]
  value_for_money: [good, poor]
  wait_time: [none, short, long]
  portion_size: [generous, small]
  tourist_trap: [absent, present]
  weather_exposed: [sheltered, present]
  entry_fee: [free, paid]
  rough_road_access: [absent, present]
  steep_or_stairs: [absent, present]
  long_walk: [absent, present]
