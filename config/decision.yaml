# Place Decision thresholds (docs/P3_PLACE_DECISION.md). Starting values; tune after the pilot.
version: 1
center: {name: "trung tâm Đà Lạt", lat: 11.9404, lng: 108.4583}
speed_kmh: {motorbike: 25, car: 25, walk: 4.5}
road_factor: 1.4            # straight line -> road distance
radius_km: {motorbike: 12, car: 15, walk: 2.0}
area_bonus: 0.2             # same area as an anchor
crowd_busy_pct: 70          # Google popular times at or above this = busy
crowd_penalty: 0.2
rainy_months: [5, 6, 7, 8, 9, 10]
min_context_fit: 0.1        # below: stays in the pool, never in the shortlist
weights: {ctx: 1.0, pref: 2.0, nov: 1.0, exp: 0.3, pop: 0.2, unc: 0.5, price: 0.5, crowd: 1.0, like: 0.5}
stars: {levels: [[4.5, "Rất hợp"], [3.5, "Hợp"], [2.0, "Khá hợp"], [0.0, "Tạm được"]]}  # fit to the trip, 0..5
top_min_pref: 0.25          # "Hợp nhất" needs at least this preference fit when the trip has wishes
price_ref_vnd: 300000       # price per person that counts as "expensive" (1.0) for price sensitivity
near_min: 12                # minutes: "Gần <tâm>" on a card
per_day: {slow: 3, normal: 4, packed: 6}
per_day_max: {slow: 4, normal: 5, packed: 7}
meals_per_day: 2
meal_at: ["12:00", "18:30"]  # meals inside a day's window take meal_min from its usable time (feasibility.room)
meal_min: 60
fill_share: 0.8             # picks using this share of the usable time: "Đủ cho chuyến đi"
spare_factor: 1.6
pool_factor: 5
default_days: 2
day_start: "08:00"
day_end: "21:00"
leave_at: "15:00"
buffer_min: {slow: 30, normal: 20, packed: 10}
intra_leg_min: 10
far_km: 8
buckets: {early_morning: ["05:00", "07:00"], morning: ["07:00", "11:00"], noon: ["11:00", "13:00"],
          afternoon: ["13:00", "17:00"], evening: ["17:00", "19:00"], night: ["19:00", "22:00"]}
narrow_buckets: [early_morning, evening, night]
timed_features: [cloud_hunting, sunset_view, live_music]
timed_share: 0.6
night_open: "16:00"
infeasible_ratio: 1.35
budget_slack: 1.0
far_step: 0.8
travel_mult_min: 0.4
price_step: 0.5
pattern_min: 3
gap_min: 90
rethink_drops: 6
history_max: 50
unverified_show: 12
page_size: 24               # places per display group shown at once; scrolling loads the next page
keep_factor: 2              # a shown place survives a new ranking while it ranks within keep_factor x the window
replace_below: 0.3          # fewer survivors than this share of the window -> replace the window whole
day_visit:                  # a day trip's visit, not a stay: served estimates can hold a night (camping) or a whole day
  by_group: {camping: [60, 90, 150]}   # short, typical, long minutes replacing the served range
  typical_max: 180
  long_max: 240
first_token_s: 8
total_s: 30
display_groups:
  nature: [nature, garden_farm, camping]
  sights: [attraction, museum, religious, amusement, market, tour, golf, other]
  chill: [cafe, spa, bar, dessert]
polarity:                   # good first, bad last
  crowd: [low, medium, high]
  noise: [quiet, moderate, loud]
  cleanliness: [clean, dirty]
  toilet: [clean, dirty]
  parking: [easy, hard]
  food_quality: [good, mixed, poor]
  drink_quality: [good, mixed, poor]
  service_attitude: [good, poor]
