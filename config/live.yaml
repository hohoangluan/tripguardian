# scripts/prewarm_transit.py (cron, once a day): fills the flights / vexere caches so a trip's coach or flight shows
# without waiting. Flights: every airport in config/airports.yaml <-> its dest; coaches: every vexere_regions entry.
transit_prewarm:
  flight_days: 30
  bus_days: 14
  pause_s: 0.5  # after each fetch, per thread
  workers: {flights: 6, buses: 12}  # threads per source; a flight thread runs its own Chromium
