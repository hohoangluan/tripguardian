# Live Context settings (docs/P4_PLANNING.md §Live Context).
# Planning reads config/planning.yaml; this file belongs to src/live alone, so src/live needs no other package.
version: 1

# OSRM runs on this machine; see scripts/osrm_setup.sh.
osrm_url: http://127.0.0.1:5000
osrm_profile: driving

# OSM has no motorbike profile, so the car profile is scaled. Every number built on this is labelled an estimate.
mode_factor:
  car: 1.0
  motorbike: 0.95
  walk: 1.0

timeout_s: 10

nominatim_url: https://nominatim.openstreetmap.org/search
# Nominatim requires an identifying User-Agent with a contact; LIVE_CONTACT fills {contact} from .env.
user_agent: "TripGuardian/0.1 (contact: {contact})"
nominatim_min_interval_s: 1.0
# Photon (komoot, OSM): search-as-you-type for the origin and lodging inputs (live.geosearch); Nominatim when it fails.
photon_url: https://photon.komoot.io/api/
suggest_timeout_s: 4  # Photon answers in ~2 s; slower than this falls back to Nominatim

# Open-Meteo: free, no key, daily forecast up to 16 days ahead; config/climate.yaml covers dates beyond that.
open_meteo_url: https://api.open-meteo.com/v1/forecast

# Maps' hotel list ("Khách sạn"), queried through corpus.crawl's public API (docs/P4_PLANNING.md §Chỗ ở (crawl live)).
lodging_query_limit: 40

# Seconds. Roads change slowly, forecasts quickly, OTA prices daily.
ttl_s:
  osrm: 604800      # 7 days
  weather: 10800    # 3 hours
  lodging: 86400    # 1 day
  geocode: 2592000  # 30 days
  transit: 93600    # 26 hours: scripts/prewarm_transit.py refreshes it once a day

tz_offset_h: 7

# Coaches (Vexere, src/live/buses): region id -> name and point, collected 2026-10-08 from route pages
# https://vexere.com/vi-VN/ve-xe-khach-tu-x-di-y-1<id>t23991.html?date=dd-mm-yyyy (the slug is ignored; "1<id>" = a
# province, "2399" = the area Đà Lạt, trailing "1"; back: 2399t1<id>1). Pages are server-rendered: the trips are in
# __NEXT_DATA__ props.initialState.routeReducer.trips (20 per page). Only provinces with coaches to Đà Lạt are listed;
# an origin uses the nearest one. Plain HTTP is enough (no browser). Province names are the 63 before the 2025 merger, as Vexere still uses them.
vexere_dalat: 2399
vexere_regions:
  - {id: 29, name: "Sài Gòn", lat: 10.7684, lng: 106.6851}
