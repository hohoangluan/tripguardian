# Serving record (src/corpus/serving, docs/PLACE_DECISION.md §2.2). Thresholds here, logic in code.
freshness_days:          # older evidence -> OUTDATED (still served, with a warning)
  hours: 90
  price: 180
  crowd: 365
  default: 730
experience_min_n: 2      # a feature says what kind of place it is (grouping) from this many authors
experience_min_mention_rate: 0.03  # ... and this share of the people whose words were read
area_km: 1.2             # radius of an area around its densest place
near_duplicate:
  jaccard: 0.6           # share of evidenced experience/environment features two places of one group must share
  min_features: 3        # places with fewer evidenced features are never grouped (too little to compare)
mmr_lambda: 0.7          # score vs difference when picking the next place of a shortlist
details:                 # free-text place details (docs/CORPUS.md, serving `details`)
  min_authors: 2         # a cluster is served from this many authors, or one authoritative source
  max_items: 6           # per list block
  known_for_more: 3
  cluster_jaccard: 0.6   # token-set overlap that merges two phrasings of one thing
  stopwords: ["rất", "khá", "hơi", "cực", "siêu", "lắm", "quá", "nha", "nhé", "thì", "là", "của", "ở", "đây", "này"]
  night_market_fid: "0x317113ff4e41e7c3:0x21cff9ad21a7243c"   # "Chợ Đêm Đà Lạt" in the corpus
  walk_max_min: 20
  walk_road_factor: 1.3
  walk_m_per_min: 80
default_region: dalat        # the region online reads when the caller names none (config/cities.yaml key)
snapshot_keep_versions: 3    # data/snapshot/<version>/ kept; older ones are deleted by the next compile
