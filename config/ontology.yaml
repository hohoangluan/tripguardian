  - {id: fee, hint: "một khoản tiền ở nơi này: vé theo đối tượng, trò chơi, thuê đồ, xe điện, gửi xe, combo; text = tên khoản", claim: "ở nơi này có khoản phải trả: {text}", audit: full, targeted: true, owner: true, needs: [amount_vnd]}
