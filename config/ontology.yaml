# Free-text kinds an Extractor copies from a source (docs/CORPUS.md, observation `detail`). claim: what a source must state, for
# the Judge ({text} is the copied words; fit also fills {who} and {verdict}). audit full = every one is read by the Judge.
# targeted: an extremes / keywords sample counts. owner: the business's own source counts. needs: fields the gate requires.
details:
  - {id: known_for, hint: "điều làm nơi này khác các nơi cùng loại, người viết nói là nổi tiếng / đặc trưng / phải thử (\"xích đu nhìn xuống hồ Tuyền Lâm\"); khen chung (\"view đẹp\", \"đồ ngon\") không phải", claim: "nơi này nổi tiếng vì: {text}", audit: sampled, targeted: false, owner: false}
  - {id: order, hint: "món hoặc thức uống nên gọi ở nơi này, người viết nói là ngon / signature / ai cũng gọi (\"bánh căn trứng\"); text = tên món", claim: "ở nơi này nên gọi: {text}", audit: sampled, targeted: true, owner: true}
  - {id: avoid, hint: "món, khu hoặc thứ nên tránh ở nơi này vì dở, đắt hoặc phí tiền; text = thứ nên tránh", claim: "ở nơi này nên tránh: {text}", audit: full, targeted: true, owner: false}
