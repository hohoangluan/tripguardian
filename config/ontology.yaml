# Feature ontology shared by every source's observations and by the User Profile (docs/P1_CORPUS.md §5).
# check: span -> each review observation is read again by REVIEW_VERIFY against claims[value]; only 'supports' is kept.
# Changing ids or values: bump version -> observations are re-extracted (docs/P1_CORPUS.md §7 ledger).
version: 10
groups: [experience, environment, service, effort, suitability, operation]
# Features a lodging (category group `stay`, config/category_defaults.yaml) may carry; aggregate drops the rest.
# "feature=value" allows that one value only. Not part of the prompt: changing it re-aggregates, never re-observes.
stay_features: [noise, scenic_view, cozy_decor, cleanliness, service_attitude, value_for_money, parking, steep_or_stairs,
                nature, couples=suitable, kids=suitable, elderly=suitable, groups=suitable]
contexts:
  time_of_day: [early_morning, morning, noon, afternoon, evening, night]
  day_type: [weekday, weekend, holiday]
  weather: [sunny, rainy, foggy, cold]
features:
  # experience
  - {id: scenic_view, group: experience, values: [present], hint: "từ nơi này nhìn ra núi, đồi, rừng thông, hồ, thung lũng hoặc thành phố, hoặc nguồn nói rõ chính nơi này \"view đẹp\". Khen chung không phải: \"không gian đẹp\", \"cảnh quan xung quanh\", \"view mặt tiền\", đường đèo đẹp, vườn hay hàng cây đẹp mà không nhìn ra các dạng cảnh trên", claims: {present: "từ nơi này nhìn ra cảnh đẹp: núi, đồi, rừng, hồ, thung lũng hoặc thành phố"}}
  - {id: cloud_hunting, group: experience, values: [present], hint: "săn mây, biển mây"}
  - {id: sunset_view, group: experience, values: [present], hint: "ngắm hoàng hôn hoặc bình minh"}
  - {id: photo_spot, group: experience, values: [present], hint: "chụp ảnh đẹp, sống ảo, nhiều góc check-in"}
  - {id: nature, group: experience, values: [present], hint: "thiên nhiên, rừng, thác, suối, không khí trong lành"}
  - {id: flower_garden, group: experience, values: [present], hint: "chính nơi này có vườn hoa, đồi hoa, thảm hoa, rừng hoa, hoặc mùa hoa của nơi này. Vài bụi hoa, một dãy hoa, hoa trồng ven đường, hoa trang trí Tết, hay \"khu vườn xinh\" không nói tới hoa đều không phải", claims: {present: "nơi này có vườn hoa, đồi hoa hoặc mùa hoa"}}
  - {id: heritage_architecture, group: experience, values: [present], hint: "kiến trúc đẹp/cổ, di tích, lịch sử, văn hóa"}
  - {id: cozy_decor, group: experience, values: [present], hint: "decor, không gian xinh, ấm cúng, có gu"}
  - {id: laptop_friendly, group: experience, values: [present], hint: "nguồn nói ngồi làm việc hoặc học bài được tại đây (\"phù hợp làm việc\", \"nơi lý tưởng để làm việc\"), hoặc có đủ bàn, ổ cắm và wifi dùng được. Wifi tệ, mạng lag, wifi bị tắt, ít ổ điện là ngược lại, không phải present; người viết kể mình làm việc ở một quán khác cũng không phải", claims: {present: "ở nơi này ngồi làm việc với laptop được"}}
  - {id: long_stay_chill, group: experience, values: [present], hint: "ngồi lâu được, chill, thư giãn, làm việc"}
  - {id: live_music, group: experience, values: [present], hint: "có người biểu diễn trực tiếp tại nơi này: ban nhạc, acoustic, ca sĩ hát live, nhạc cụ sống (saxophone, guitar), chương trình ca nhạc. Nhạc phát qua loa hay playlist không phải, kể cả khi khen (\"nhạc hay\", \"nhạc du dương\", \"hát hay\"); karaoke không phải", claims: {present: "nơi này có nhạc sống do người biểu diễn trực tiếp"}}
  - {id: adventure_activity, group: experience, values: [present], hint: "zipline, máng trượt, canyoning, cưỡi ngựa, trò mạo hiểm"}
  - {id: hiking, group: experience, values: [present], hint: "trekking, leo núi, đi bộ đường dài"}
  - {id: animals, group: experience, values: [present], hint: "có thú/vật nuôi để xem hoặc chơi cùng (mèo, cừu, ngựa…)"}
  - {id: local_specialty_food, group: experience, values: [present], hint: "nguồn gọi món ở đây là đặc sản / đặc trưng / món địa phương (\"đúng chất đặc sản\", \"hương vị địa phương\", \"món local\"), hoặc nơi này bán món đặc sản của vùng (lẩu gà lá é, cá tầm, bánh canh chả cá, bánh ướt lòng gà, nem nướng, dâu / atiso / hồng, rượu vang Đà Lạt). Món chỉ được khen ngon, đậm đà, lạ miệng, hay sốt riêng của quán thì không phải; món phổ thông (cơm, mì ly, trứng luộc, gà nướng) cũng không phải", claims: {present: "nơi này bán món đặc sản hoặc món đặc trưng của địa phương"}}
  - {id: food_quality, group: experience, values: [good, mixed, poor], hint: "đồ ăn ngon / bình thường / dở"}
  - {id: drink_quality, group: experience, values: [good, mixed, poor], hint: "đồ uống ngon / bình thường / dở"}
  - {id: hands_on_workshop, group: experience, values: [present], hint: "workshop tự tay làm: pizza, socola, bánh, rang/pha cà phê, đồ thủ công"}
  - {id: pick_your_own, group: experience, values: [present], hint: "tự hái dâu, rau, trái cây tại vườn"}
  - {id: cultural_show, group: experience, values: [present], hint: "biểu diễn / giao lưu văn hóa: cồng chiêng, văn hóa bản địa"}
  - {id: camping, group: experience, values: [present], hint: "cắm trại, ngủ lều, glamping"}
  - {id: tasting_available, group: experience, values: [present], hint: "được nếm / uống thử tại chỗ (trà, cà phê, rượu vang, mứt, đặc sản)"}
  - {id: costume_rental, group: experience, values: [present], hint: "có cho thuê trang phục để chụp ảnh tại chỗ (áo dài, đồ dân tộc, đồ cosplay)"}
  # environment
  - {id: crowd, group: environment, values: [low, medium, high], hint: "low: vắng, ít khách; medium: \"hơi đông\", \"không quá đông\"; high: đông, chật, phải chờ chỗ. \"Không quá đông\" là medium chứ không phải low, \"không đông\" là low chứ không phải medium; đông của khu vực hay của quán khác, nổi tiếng trên mạng, và số người trong nhóm người viết đều không phải", claims: {low: "nơi này vắng khách", medium: "nơi này đông khách vừa phải", high: "nơi này đông khách"}}
  - {id: noise, group: environment, values: [quiet, moderate, loud], hint: "quiet: yên tĩnh, không ồn ào; moderate: \"hơi ồn\", \"không yên tĩnh lắm\"; loud: ồn, ồn ào, bát nháo, phải nói lớn. \"Hơi ồn\" là moderate chứ không phải loud; \"không ồn ào\", \"không quá ồn\" là quiet chứ không phải moderate; ánh sáng, mùi, bầu không khí không nói gì về độ ồn", claims: {quiet: "nơi này yên tĩnh", moderate: "nơi này hơi ồn", loud: "nơi này ồn"}}
  - {id: setting, group: environment, values: [indoor, outdoor, both], hint: "indoor: khách ngồi hoặc tham quan trong nhà, phòng kín, nhà kính; outdoor: ngoài trời, sân vườn, \"không gian mở\", \"quán ngoài trời\"; both: nguồn nói rõ nơi này có CẢ khu trong nhà lẫn khu ngoài trời (\"có khu vực ngoài trời và trong nhà\", \"trong nhà và ngoài hiên\"). Nhiều tầng, nhiều gian nhà, hay sân có mái che không chứng minh both", claims: {indoor: "nơi này ở trong nhà", outdoor: "nơi này ở ngoài trời", both: "nơi này có cả khu trong nhà và khu ngoài trời"}}
  - {id: cleanliness, group: environment, values: [clean, dirty], hint: "sạch sẽ / bẩn, nhiều rác"}
  - {id: weather_exposed, group: environment, values: [present, sheltered], hint: "present: trải nghiệm phụ thuộc thời tiết (mưa thì lầy / không chơi được, không có mái che, sương mù che view); sheltered: chính nơi này có mái che hoặc ở trong nhà nên mưa vẫn đi được. Thấy nóng / lạnh không phải; nhân viên che dù ra xe, xe / áo mưa cho thuê (\"đi không sợ mưa gió\") không phải sheltered", check: span, claims: {present: "mưa, nắng hoặc sương mù làm hỏng trải nghiệm ở nơi này vì nó không có che chắn", sheltered: "chính nơi này có mái che hoặc ở trong nhà nên mưa vẫn tham quan được"}}
  - {id: parking, group: environment, values: [easy, hard], hint: "gửi xe dễ / khó"}
  - {id: outdoor_seating, group: environment, values: [present], hint: "có chỗ cho khách ngồi ở ngoài trời: bàn ngoài sân, sân vườn, ban công, sân thượng, vỉa hè. \"Có chỗ ngồi\" mà không nói ngoài trời, \"không gian mở\", \"không gian thoáng\", sân chơi hay bãi cỏ không có chỗ ngồi, và khu ăn trong nhà đều không phải", claims: {present: "nơi này có chỗ ngồi ngoài trời cho khách"}}
  - {id: spacious, group: environment, values: [present], hint: "không gian rộng, thoáng"}
  - {id: small_space, group: environment, values: [present], hint: "không gian nhỏ, chật, ít bàn, chen chúc"}
  - {id: toilet, group: environment, values: [clean, dirty], hint: "clean: nguồn nói nhà vệ sinh của nơi này sạch, thơm; dirty: bẩn, dơ, hôi, xuống cấp. Chỉ nói \"có nhà vệ sinh\", nhà vệ sinh đẹp, phòng tắm sạch, nhà vệ sinh bị hỏng, \"nên sửa lại wc\", hay mùi từ bếp bay sang đều không phải", claims: {clean: "nhà vệ sinh ở nơi này sạch", dirty: "nhà vệ sinh ở nơi này bẩn, hôi hoặc xuống cấp"}}
  - {id: mosquitoes, group: environment, values: [present], hint: "nhiều muỗi, côn trùng, vắt"}
  # service
  - {id: service_attitude, group: service, values: [good, poor], hint: "thái độ nhân viên/chủ: nhiệt tình, thân thiện / khó chịu, thô lỗ"}
  - {id: service_quality, group: service, values: [good, mixed, poor], hint: "chất lượng dịch vụ, tay nghề, làm kỹ, nhanh / bình thường / ẩu, chậm, kém"}
  - {id: value_for_money, group: service, values: [good, poor], hint: "giá hợp lý, đáng tiền / đắt, không xứng"}
  - {id: tourist_trap, group: service, values: [present, absent], hint: "present: chặt chém, ngáo giá, cò mồi, ép mua, lừa khách; absent: review nói rõ không chặt chém, giá niêm yết / đúng như menu, không ép mua. Chỉ \"giá rẻ\", \"giá hợp lý\" là value_for_money, không phải absent", check: span, claims: {present: "nơi này chặt chém, ngáo giá, cò mồi hoặc lừa khách", absent: "nơi này không chặt chém: giá niêm yết rõ, đúng giá, không ép mua"}}
  - {id: wait_time, group: service, values: [none, short, long], hint: "không phải chờ / chờ chút / chờ lâu"}
  - {id: booking_needed, group: service, values: ["yes", "no"], hint: "yes: phải đặt trước mới chắc có chỗ / vé (\"nên đặt bàn trước, tới là hết chỗ\"); no: không cần đặt vẫn có chỗ, quán không nhận đặt. Người viết kể mình đã đặt bàn hay được xác nhận có bàn (\"mình đặt bàn trước\", \"đặt bàn được xác nhận\") không phải. Đặt trước để khỏi chờ món, để chọn giờ vắng, hay chỉ \"nên đặt vé trước\" chung chung đều không phải yes: phải là đặt để chắc có chỗ hoặc có vé. Không cần đặt mà chỉ đúng với một ngày hay giờ cụ thể (\"đi trong tuần nên không cần đặt\") không phải no", check: span, claims: {"yes": "phải đặt trước mới chắc có chỗ hoặc vé ở nơi này", "no": "không đặt trước vẫn có chỗ ở nơi này"}}
  - {id: portion_size, group: service, values: [generous, small], hint: "khẩu phần nhiều, ăn không hết / ít"}
  - {id: entry_fee, group: service, values: [free, paid], hint: "vào cửa miễn phí / phải mua vé (kể cả khi nêu giá vé; quote gồm cả số tiền nếu review nêu, vd \"vé 50k/người\")", check: span, claims: {free: "vào nơi này miễn phí cho mọi khách", paid: "vào nơi này phải mua vé"}}
  - {id: vegetarian_options, group: service, values: ["yes", "no"], hint: "có / không có món chay"}
  - {id: cash_only, group: service, values: [present, absent], hint: "present: chỉ nhận tiền mặt, không chuyển khoản / quẹt thẻ; absent: nhận chuyển khoản, quẹt thẻ, ví điện tử"}
  - {id: condition_change, group: service, values: [declined], hint: "chính nơi này xuống cấp so với trước đây (vd: trước đẹp, giờ chặt hết cây, bỏ hoang, không còn như xưa). Đồ mới, xe mới, mới mở, lần sau quay lại không phải. Phải có so sánh với trước đây. Đồ cũ, chuồng cũ, đang cải tạo, \"thay đổi nhiều\", nơi đã đóng cửa, hay chỉ mô tả hiện trạng hoang tàn mà không so với trước đều không phải", check: span, claims: {declined: "chính nơi này xuống cấp so với trước đây"}}
  # effort
  - {id: rough_road_access, group: effort, values: [present, absent], hint: "present: đường vào xấu: đất, đá, lầy, khó đi xe; absent: đường vào dễ đi: đường nhựa / bê tông, xe máy / ô tô vào tận nơi. Đường đi xa hay đông xe không phải", check: span, claims: {present: "đường vào nơi này xấu, khó đi (đất, đá, lầy)", absent: "đường vào nơi này dễ đi (đường nhựa hoặc bê tông, xe vào tận nơi)"}}
  - {id: steep_or_stairs, group: effort, values: [present, absent], hint: "present: khách phải leo dốc cao, nhiều bậc thang; absent: bằng phẳng, không phải leo, xe chạy thẳng lên tới tận nơi (\"đi thẳng xe lên\"). Quán nằm trên con dốc mà khách không phải leo thì không phải present. Quote phải nói chính khách leo bộ: \"leo\", \"bậc thang\", \"bậc cấp\", \"đi bộ lên dốc\". Dốc của đường xe chạy (\"đèo dốc quanh co\", \"đường dốc khó đi\", \"đoạn dốc cao\" trên đường tới) thuộc rough_road_access, không phải present; \"dốc nhẹ\", \"đường dễ đi\", \"ô tô vào tới cổng\" không chứng minh absent cho cả khu tham quan", check: span, claims: {present: "khách phải leo dốc cao hoặc nhiều bậc thang để vào hoặc tham quan nơi này", absent: "khách không phải leo dốc hay bậc thang để vào và tham quan nơi này"}}
  - {id: long_walk, group: effort, values: [present, absent], hint: "present: khách phải ĐI BỘ (không phải đi xe) một quãng xa để tới hoặc tham quan; quote phải nói đi bộ / cuốc bộ / leo, hoặc khoảng cách, thời gian đi bộ (\"gửi xe đi bộ 2km\", \"đi bộ 30 phút\"); absent: đậu xe sát cửa, đi bộ vài bước. Đường đi / đường vào quán xa (\"đường đi hơi xa\", \"đường vào hơi xa\", đi xe) hay đường đi bộ riêng của người viết không phải. Quote phải có quãng đường hoặc thời gian đi bộ, hoặc nói rõ đi bộ xa / rã rời từ chỗ đậu xe tới nơi; \"phải đi bộ\", \"đi bộ hơi mệt\" chung chung không đủ; nơi có xe điện hoặc xe chở lên thì không phải absent", check: span, claims: {present: "khách phải đi bộ (không phải đi xe) một quãng xa để tới hoặc tham quan nơi này", absent: "khách đậu xe gần và chỉ đi bộ một đoạn ngắn ở nơi này"}}
  # suitability: permissive values can harm when wrong -> always checked by a person (docs/P1_CORPUS.md §6)
  - {id: kids, group: suitability, values: [suitable, unsuitable], verify: always, caution_values: [unsuitable], hint: "nói rõ hợp / không hợp trẻ em", check: span, claims: {suitable: "nơi này hợp với trẻ em", unsuitable: "nơi này không hợp với trẻ em"}}
  - {id: elderly, group: suitability, values: [suitable, unsuitable], verify: always, caution_values: [unsuitable], hint: "nói rõ hợp / không hợp người lớn tuổi", check: span, claims: {suitable: "nơi này hợp với người lớn tuổi", unsuitable: "nơi này không hợp với người lớn tuổi"}}
  - {id: wheelchair, group: suitability, values: [suitable, unsuitable], verify: always, caution_values: [unsuitable], hint: "nói rõ xe lăn đi được / không đi được", check: span, claims: {suitable: "người đi xe lăn vào được nơi này", unsuitable: "người đi xe lăn không vào được nơi này"}}
  - {id: couples, group: suitability, values: [suitable, unsuitable], verify: always, caution_values: [unsuitable], hint: "nói rõ hợp / không hợp cặp đôi, hẹn hò", check: span, claims: {suitable: "nơi này hợp với cặp đôi", unsuitable: "nơi này không hợp với cặp đôi"}}
  - {id: groups, group: suitability, values: [suitable, unsuitable], verify: always, caution_values: [unsuitable], hint: "nói rõ hợp / không hợp đi nhóm đông", check: span, claims: {suitable: "nơi này hợp với nhóm đông", unsuitable: "nơi này không hợp với nhóm đông"}}
  # operation: an Estimate, always shown as a range (docs/P1_CORPUS.md §5)
  - {id: visit_duration, group: operation, values: [under_1h, 1_to_2h, half_day, full_day], hint: "khách nói đã ở / cần bao lâu cho chuyến ghé (\"đi 1 vòng 30 phút\", \"chơi hết cả buổi sáng\"); thời gian chờ món, chờ xe, thời lượng một liệu trình / gói dịch vụ (\"massage 90 phút\") không phải. Giá trị phải khớp con số nguồn nói: tới 1 tiếng là under_1h, hơn 1 đến 2 tiếng là 1_to_2h, hơn 2 tiếng đến nửa ngày (vd 5 tiếng) là half_day, cả ngày là full_day. Thời lượng cả khu lớn hơn nơi này không phải", claims: {under_1h: "chuyến ghé nơi này gọn trong 1 tiếng", 1_to_2h: "chuyến ghé nơi này mất 1 đến 2 tiếng", half_day: "chuyến ghé nơi này mất khoảng nửa ngày", full_day: "chuyến ghé nơi này mất khoảng cả ngày"}}
