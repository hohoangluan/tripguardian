# Planning & Validation thresholds (docs/PLANNING.md §Cấu hình). Starting values; tune after the pilot.
# Live endpoints and TTLs live in config/live.yaml: src/live may not read this file.
version: 1

# Rough travel, used only when OSRM is down or has no road for a pair. Every number built on it is an estimate.
road_factor: 1.4            # straight line -> road distance
rough_speed_kmh: {motorbike: 25, car: 25, ride: 22}
walk_km: 0.4                # a leg shorter than this is walked
walk_kmh: 4.5

# The trip frame when the user did not say.
default_days: 2
day_start: "08:00"
day_end: "21:00"
leave_at: "15:00"

# Pace. visit_key picks which of the record's visit minutes (short / typical / long) a pace uses.
visit_key: {slow: long, normal: typical, packed: short}
per_day: {slow: 3, normal: 4, packed: 6}
buffer_min: {slow: 30, normal: 20, packed: 10}
long_leg_min: 30            # a leg longer than this adds buffer_extra_long
buffer_extra_long: 10
buffer_extra_uncertain: 10  # a place whose opening hours are UNCERTAIN / OUTDATED
rest_min: {slow: 20, normal: 15, packed: 10}
max_consecutive_min: {slow: 90, normal: 120, packed: 180}   # active minutes (visit + travel) before a rest is forced

# Meals. A confirmed meal place takes a window; a window nobody takes gets a free block, never an invented place.
meals_per_day: 2
meal_min: 60
meal_windows: {lunch: ["11:30", "13:30"], dinner: ["18:00", "20:30"]}   # earliest and latest start

# Timed features: where in the day a place that is known for it has to start.
# anchor sunrise / sunset: minutes from it; anchor clock: absolute times.
pins:
  sunset_view: {anchor: sunset, from_min: -75, to_min: -20}
  cloud_hunting: {anchor: sunrise, from_min: -30, to_min: 60}
  live_music: {anchor: clock, from: "18:00", to: "20:00"}

# Grouping and day assignment.
cluster_max_min: 25         # complete-link diameter of one cluster, in minutes of real travel
cluster_merge_min: 8        # clusters of different areas merge only when this close
fill_ratio: 0.8             # a cluster whose load exceeds this share of a day is split
intra_leg_min: 10           # minutes charged per place for moving inside a cluster when sizing a day
max_days: 7
max_clusters: 8
exact_n: 7                  # up to this many stops a day the order is found by trying every permutation
improve_passes: 5
weights: {travel: 1.0, overflow: 3.0, count: 15.0, closed: 1000.0, crowd: 8.0}

# Weather. P4 takes a forecast as input; P5 fetches it (live.weather). A day whose rain probability is at or above
# rain_high is a rainy day: its buffers grow, and its weather-exposed places are lost in the rain scenario.
rain_high: 0.6
buffer_extra_rain: 10

# Day conditions (docs/PLANNING.md §Điều kiện từng ngày): what the date itself changes. Every figure is an estimate to tune
# after the pilot. A day with no signal behaves exactly as without this block.
crowd_busy_pct: 70          # a place's own Google popular-times figure at or above this = busy at that time
conditions:
  heavy_rain_mm: 30         # daily rain at or above this, or a thunderstorm, is a heavy day: exposed places count as rained on
  heavy_gust_kmh: 50
  severe_rain_mm: 80        # at or above this a weather-exposed place is not scheduled that day (validate refuses it)
  severe_gust_kmh: 70
  crowd_visit_pct: {busy: 15, peak: 30}   # queue time added to a visit to a place that is busy on that kind of day
  crowd_buffer_min: {busy: 5, peak: 10}   # extra buffer after such a visit
  crowd_avoid_factor: 3.0   # the user said they avoid crowds: the day-split crowd cost is multiplied by this
  closure_buffer_min: 10    # extra buffer after a meal place on a day many shops close (Tết)

# Robustness (docs/PLANNING.md ⓕ): fixed perturbations, never random. Each scenario re-runs the order of
# every day and counts the places that no longer fit. tier small = the few small delays a solid plan must absorb.
robustness:
  scenarios:
    - {id: late_15, tier: small, start_min: 15}
    - {id: visit_20, tier: small, visit_pct: 20}
    - {id: travel_25, tier: small, travel_pct: 25}
    - {id: late_30, tier: large, start_min: 30}
    - {id: rain, tier: large, rain: true}
  solid_max_lost: 0         # every scenario loses at most this many places -> solid
  feasible_max_lost: 0      # every small scenario loses at most this many -> feasible; otherwise fragile

# Objectives (docs/ARCHITECTURE.md §10): tried in this order when the trip calls for them, at most max_variants.
max_variants: 3
objective_order: [least_travel, weather_robust, preference_fit, low_cost, diverse]
objective_weights:          # merged over `weights` when the days are split for that objective
  least_travel: {travel: 2.0}
  low_cost: {}
  weather_robust: {exposed: 400.0}
  diverse: {repeat: 40.0}
  preference_fit: {pref_risk: 200.0}

# Backups (ⓗ): which visits are sensitive, and how far a replacement may be.
near_close_min: 30          # a visit that ends this close to closing time
far_leg_min: 40             # a place this far from where its day starts
backup_radius_min: 25       # rough minutes from the sensitive place to a replacement
backups_per_place: 2

# Lodging (ⓐ, P5): a candidate competes as the anchor of each day; it never becomes Place Intelligence.
radius_km: {motorbike: 3.0, car: 5.0, ride: 4.0}
lodging_k: 6
lodging_share: 0.3  # share of budget_vnd spent on lodging, over the whole stay
min_reviews: 5
split_min: 20       # minutes of real travel diameter beyond which the search area splits into two centres

# Sessions (P6, docs/PLANNING.md §Vòng người dùng sửa và góp ý).
history_max: 20              # versions kept for undo / redo
repair_diff_weight: 5.0      # repair_day's penalty per stop whose relative order changes from the version before it
decision_url: http://127.0.0.1:8767   # Place Decision's HTTP API, to resolve a decision_session_id at session create

# Agent turn (P7, docs/PLANNING.md §Vòng người dùng sửa và góp ý). Same shape as config/decision.yaml.
first_token_s: 6.0            # the first streamed token must arrive by this long, or the turn falls back to policy
total_s: 20.0                 # the whole answer must arrive by this long
rethink_drops: 4              # dropping this many places in one planning session: a turn's next drop is refused,
                              # the user is told to go back to Place Decision instead (not a chip-level limit)
