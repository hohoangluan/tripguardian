[project]
name = "tripguardian"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "langchain-openai>=1.7",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6",
    "psycopg[binary,pool]>=3.2",
    "lancedb>=0.40",
    "polars>=2.0",
    "pyarrow>=20",
    "orjson>=3.10",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "streamlit>=1.40"]
asr = ["chunkformer", "silero-vad", "soundfile", "torch", "transformers"]  # chunkformer: pip install --no-deps (deepspeed fails on Windows)

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trip = ["runtime_skills/*/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls the real AGENT model (python -m pytest -m live)",
    "pg: needs a Postgres in TEST_DATABASE_URL (each test gets a throwaway schema); skipped without it",
    "corpus: needs data/snapshot/current (python -m corpus snapshot); skipped without it",
]
addopts = "-m 'not live'"
