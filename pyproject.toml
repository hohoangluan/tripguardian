[project]
name = "tripguardian"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
asr = ["chunkformer", "silero-vad", "soundfile", "torch"]  # chunkformer: pip install --no-deps (deepspeed fails on Windows)

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: calls the real AGENT model (python -m pytest -m live)"]
addopts = "-m 'not live'"
