<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt dữ liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --mist: #EEF1EE; --paper: #F8FAF8; --ink: #1F2A24; --ink-soft: #55635A; --rule: #CBD3CC;
  --moss: #3F6B4E; --moss-tint: #DCE8DF; --brick: #A3453A; --brick-tint: #F1DEDA;
  --hydrangea: #5B6FB5; --hydrangea-tint: #E1E5F4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mist: #141A16; --paper: #1B231E; --ink: #E4EAE5; --ink-soft: #9DAAA1; --rule: #2F3A33;
    --moss: #7FB08E; --moss-tint: #22342A; --brick: #E08A7E; --brick-tint: #3A2522;
    --hydrangea: #9AA9E0; --hydrangea-tint: #262C44;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--mist); color: var(--ink); font: 15px/1.55 "Be Vietnam Pro", system-ui, sans-serif; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hydrangea); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; height: 100vh; }
.side { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.head { padding: 20px 20px 12px; }
.head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 12px; }
.tab { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--mist); border-color: var(--ink); }
.tab b { font-weight: 600; margin-left: 4px; }
.toggle { padding: 0 20px 12px; font-size: 13px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
.list { overflow-y: auto; flex: 1; border-top: 1px solid var(--rule); }
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 12px 20px; cursor: pointer; }
.row:hover { background: var(--paper); }
.row[aria-current="true"] { background: var(--hydrangea-tint); box-shadow: inset 3px 0 0 var(--hydrangea); }
.row .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
.row .w { color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.row .done { font-size: 12px; font-weight: 600; }
.empty { padding: 40px 20px; color: var(--ink-soft); }

.main { display: flex; flex-direction: column; min-height: 0; }
.detail { flex: 1; overflow-y: auto; padding: 28px 36px; }
.detail h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.35; max-width: 70ch; font-weight: 600; }
.why { margin: 0 0 20px; max-width: 70ch; color: var(--ink-soft); }
.why strong { color: var(--ink); font-weight: 600; }
.body { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
.embed { width: 325px; height: 578px; border: 0; border-radius: 12px; background: var(--paper); flex: none; }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; max-width: 60ch; }
dt { color: var(--ink-soft); }
dd { margin: 0; overflow-wrap: anywhere; }
.link { color: var(--hydrangea); }

.bar { border-top: 1px solid var(--rule); background: var(--paper); padding: 16px 36px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.bar textarea { width: 100%; resize: none; height: 44px; border: 1px solid var(--rule); border-radius: 8px; background: var(--mist); padding: 10px 12px; }
.acts { display: flex; gap: 10px; }
.act { border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.act kbd { font: 600 12px/1 "Be Vietnam Pro", sans-serif; border-radius: 5px; padding: 3px 6px; background: rgba(255,255,255,.22); }
.act.good { background: var(--moss); color: #fff; }
.act.bad { background: var(--brick); color: #fff; }
.act.neutral { background: var(--hydrangea); color: #fff; }
.act:disabled { opacity: .45; cursor: default; }
.keys { grid-column: 1 / -1; color: var(--ink-soft); font-size: 12.5px; }
.toast { position: fixed; bottom: 96px; right: 36px; background: var(--ink); color: var(--mist); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .15s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .side { border-right: 0; }
  .list { max-height: 40vh; }
  .detail { padding: 20px 16px; }
  .bar { padding: 12px 16px; grid-template-columns: 1fr; }
  .embed { width: 100%; max-width: 325px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="head">
      <h1>Duyệt dữ liệu</h1>
      <p id="summary">Đang tải…</p>
    </div>
    <div class="tabs" id="tabs" role="toolbar" aria-label="Loại mục"></div>
    <label class="toggle"><input type="checkbox" id="showDone"> Hiện cả mục đã quyết</label>
    <nav class="list" id="list" aria-label="Hàng đợi"></nav>
  </aside>
  <main class="main">
    <section class="detail" id="detail" aria-live="polite"></section>
    <div class="bar">
      <textarea id="note" placeholder="Ghi chú (không bắt buộc) — lý do, để lần sau hiệu chỉnh model"></textarea>
      <div class="acts" id="acts"></div>
      <div class="keys">↑ ↓ chuyển mục · 1 / 2 chọn quyết định · N ghi chú · Esc thoát ghi chú</div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const KINDS = {
  video_filter:   { label: "Video bị lọc", ask: "Video này có liên quan du lịch Đà Lạt không?" },
  video_comments: { label: "Video thiếu comment", ask: "Crawl lại comment hay chấp nhận như hiện tại?" },
  place_qc:       { label: "Địa điểm bị gắn cờ", ask: "Giữ địa điểm này hay loại khỏi dữ liệu?" },
  place_reviews:  { label: "Địa điểm thiếu review", ask: "Crawl lại review hay chấp nhận như hiện tại?" },
  place_verify:   { label: "Video ↔ địa điểm", ask: "Video này có nói về / cho thấy đúng địa điểm này không?" },
};
const ACTION = {
  keep:    { text: "Giữ",          cls: "good",    done: "Đã giữ" },
  drop:    { text: "Bỏ",           cls: "bad",     done: "Đã bỏ" },
  accept:  { text: "Chấp nhận",    cls: "good",    done: "Đã chấp nhận" },
  disable: { text: "Loại",         cls: "bad",     done: "Đã loại" },
  retry:   { text: "Crawl lại",    cls: "neutral", done: "Đã xếp crawl lại" },
};
const STATUS = { no: "model: không liên quan", unsure: "model: không chắc", incomplete: "chưa đủ", bad: "qc: bad", warn: "qc: warn", error: "qc: lỗi model" };
let items = [], kind = null, cur = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function load(keepId) {
  const r = await fetch("/api/queue" + ($("showDone").checked ? "?decided=1" : ""));
  const data = await r.json();
  items = data.items;
  const open = items.filter(i => !i.decision).length;
  $("summary").textContent = open ? `Còn ${open} mục cần bạn quyết · ${data.city}` : `Không còn mục nào cần bạn quyết · ${data.city}`;
  const counts = {};
  items.forEach(i => counts[i.kind] = (counts[i.kind] || 0) + 1);
  if (!kind || !counts[kind]) kind = Object.keys(KINDS).find(k => counts[k]) || null;
  $("tabs").innerHTML = Object.keys(KINDS).filter(k => counts[k]).map(k =>
    `<button class="tab" aria-pressed="${k === kind}" data-k="${k}">${KINDS[k].label}<b>${counts[k]}</b></button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { kind = b.dataset.k; cur = 0; render(); });
  const shown = visible();
  if (keepId) { const i = shown.findIndex(x => x.id === keepId); cur = i >= 0 ? i : Math.min(cur, shown.length - 1); }
  cur = Math.max(0, Math.min(cur, shown.length - 1));
  render();
}
const visible = () => items.filter(i => i.kind === kind);

function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === kind));
  const shown = visible();
  $("list").innerHTML = shown.length ? shown.map((it, n) => `
    <button class="row" data-n="${n}" aria-current="${n === cur}">
      <div class="t">${esc(it.title)}</div>
      <div class="w">${it.decision ? `<span class="done">${ACTION[it.decision.decision].done}</span> · ` : ""}${esc(STATUS[it.status] || it.status)}</div>
    </button>`).join("") : `<div class="empty">Không còn mục nào ở đây. Chọn loại khác hoặc bật “Hiện cả mục đã quyết”.</div>`;
  document.querySelectorAll(".row").forEach(b => b.onclick = () => { cur = +b.dataset.n; render(); });
  const it = shown[cur];
  document.querySelector(`.row[data-n="${cur}"]`)?.scrollIntoView({ block: "nearest" });
  if (!it) { $("detail").innerHTML = ""; $("acts").innerHTML = ""; return; }
  const dl = Object.entries(it.details || {}).filter(([, v]) => v !== null && v !== undefined && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(v) ? v.join(", ") : v)}</dd>`).join("");
  const embed = it.source === "tiktok" ? `<iframe class="embed" title="Video TikTok" loading="lazy" allow="encrypted-media" src="https://www.tiktok.com/embed/v2/${encodeURIComponent(it.embed)}"></iframe>` : "";
  $("detail").innerHTML = `
    <h2>${esc(it.title)}</h2>
    <p class="why"><strong>${esc(KINDS[it.kind].ask)}</strong><br>${esc(it.why)}</p>
    <div class="body">${embed}<dl>${dl}
      ${it.url ? `<dt>nguồn</dt><dd><a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">${it.source === "tiktok" ? "Xem trên TikTok" : "Xem trên Google Maps"}</a></dd>` : ""}
      <dt>id</dt><dd>${esc(it.id)}</dd>
      ${it.decision ? `<dt>đã quyết</dt><dd>${ACTION[it.decision.decision].done} ${esc(it.decision.note ? "— " + it.decision.note : "")}</dd>` : ""}
    </dl></div>`;
  $("acts").innerHTML = it.actions.map((a, n) =>
    `<button class="act ${ACTION[a].cls}" data-a="${a}">${ACTION[a].text}<kbd>${n + 1}</kbd></button>`).join("");
  document.querySelectorAll(".act").forEach(b => b.onclick = () => act(b.dataset.a));
}

async function act(decision) {
  const it = visible()[cur];
  if (!it) return;
  const r = await fetch("/api/decision", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind: it.kind, id: it.id, decision, note: $("note").value.trim() }) });
  if (!r.ok) { toast("Không lưu được: " + (await r.json()).error); return; }
  toast(`${ACTION[decision].done}: ${it.title.slice(0, 48)}`);
  $("note").value = "";
  const next = visible()[cur + 1];
  await load($("showDone").checked ? (next ? next.id : it.id) : null);
}

let tId;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tId); tId = setTimeout(() => t.classList.remove("on"), 2200); }

document.addEventListener("keydown", e => {
  if (e.target === $("note")) { if (e.key === "Escape") $("note").blur(); return; }
  const shown = visible();
  if (e.key === "ArrowDown") { cur = Math.min(cur + 1, shown.length - 1); render(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { cur = Math.max(cur - 1, 0); render(); e.preventDefault(); }
  else if (e.key === "n" || e.key === "N") { $("note").focus(); e.preventDefault(); }
  else if (/^[1-9]$/.test(e.key)) { const a = shown[cur]?.actions[+e.key - 1]; if (a) act(a); }
});
$("showDone").onchange = () => load();
load();
</script>
</body>
</html>
